<style>:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1b2030; --ink2:#4a5168; --muted:#7b8196; --line:#e2ddd2; --line2:#d3ccbe;
  --accent:#d9480f; --accent-soft:#fde8dc; --teal:#0b7a75; --teal-soft:#dff3f1; --blue:#2952cc; --blue-soft:#e3eafc;
  --ok:#2b8a3e; --ok-soft:#e3f6e7; --bad:#c92a2a; --bad-soft:#fde4e4; --warn:#b7791f; --warn-soft:#fdf2d8;
  --code-bg:#1d2130; --code-ink:#e6e8ef; --code-line:#2a2f42; --code-gutter:#6c7393; --hl:#3b3f2a;
  --k:#ff9e64; --s:#a6e3a1; --n:#f9c74f; --c:#7f849c; --f:#89b4fa; --b:#cba6f7;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.06);
  --r:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --paper:#1a1d28; --ink:#eceef5; --ink2:#b9bfd3; --muted:#8a90a6; --line:#2a2e3d; --line2:#363b4e;
  --accent:#ff8a4c; --accent-soft:#3a2418; --teal:#4fd1c5; --teal-soft:#16302f; --blue:#8aa8ff; --blue-soft:#1d2645;
  --ok:#69db7c; --ok-soft:#173022; --bad:#ff8787; --bad-soft:#3a1d1f; --warn:#f6c453; --warn-soft:#352b14;
  --code-bg:#0e1017; --code-line:#1f2333; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#12141c; --paper:#1a1d28; --ink:#eceef5; --ink2:#b9bfd3; --muted:#8a90a6; --line:#2a2e3d; --line2:#363b4e;
  --accent:#ff8a4c; --accent-soft:#3a2418; --teal:#4fd1c5; --teal-soft:#16302f; --blue:#8aa8ff; --blue-soft:#1d2645;
  --ok:#69db7c; --ok-soft:#173022; --bad:#ff8787; --bad-soft:#3a1d1f; --warn:#f6c453; --warn-soft:#352b14;
  --code-bg:#0e1017; --code-line:#1f2333; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);color:var(--ink);padding:.08em .35em;border-radius:5px}
pre code{background:none;padding:0}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 14px var(--mono)}
.top .sp{flex:1}
.iconbtn{text-decoration:none;color:var(--ink);border:1px solid var(--line2);background:var(--paper);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.iconbtn:hover{border-color:var(--ink2)}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none!important}}

/* home */
.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.025em;max-width:22ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--ink2);max-width:62ch;margin:0}
.flow4{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.flow4 span{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.flow4 b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font:800 24px var(--sans);letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:40px}
.card{display:flex;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--line2)}
.card .num{font:700 12px var(--mono);color:var(--muted)}
.card h3{font-size:17px;margin:2px 0 4px}
.card p{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}
.ring{flex:none;width:52px;height:52px;position:relative}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink2)}
.sectionlabel{font:700 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}

/* topic */
.thead{padding:22px 0 0}
.crumb{font-size:14px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.thead h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.thead h1 .ic{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:22px;flex:none}
.tabs{position:sticky;top:56px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-top:12px}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:11px}
.tab.on{color:var(--ink);border-color:var(--accent)}
.tab.on .n{background:var(--accent);color:#fff}
.tab .tick{color:var(--ok)}
.pane{padding-top:22px;padding-bottom:60px}
.lead{font-size:17px;color:var(--ink2);max-width:70ch}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 14px;box-shadow:var(--shadow)}
.sec h2{font-size:20px;display:flex;gap:10px;align-items:baseline}
.sec h2 .k{font:700 13px var(--mono);color:var(--accent)}
.sec p{margin:.4em 0 .8em}
.sec ul{padding-left:1.2em;margin:.4em 0 .8em}
.sec table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:15px;display:block;overflow-x:auto}
.sec th,.sec td{border:1px solid var(--line2);padding:6px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--bg)}
.box{border-radius:12px;padding:14px 16px;margin:12px 0}
.box h3{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.box ul{margin:0;padding-left:1.2em}
.box li{margin:3px 0}
.box.key{background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 35%,transparent)}
.box.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.box.exam{background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 35%,transparent)}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}

/* code display */
.codeview{background:var(--code-bg);color:var(--code-ink);border-radius:12px;overflow:auto;font:14px/1.6 var(--mono);margin:10px 0;position:relative}
.codeview pre{margin:0;padding:12px 0;min-width:max-content}
.codeview .ln{display:block;padding:0 14px 0 0}
.codeview .ln::before{content:attr(data-n);display:inline-block;width:38px;text-align:right;margin-right:14px;color:var(--code-gutter);user-select:none}
.codeview .ln.cur{background:var(--hl);box-shadow:inset 3px 0 var(--n)}
.codeview .ln.flash{background:#34405f}
.snipbar{display:flex;gap:8px;align-items:center;margin-top:-4px}
.tk-k{color:var(--k)} .tk-s{color:var(--s)} .tk-n{color:var(--n)} .tk-c{color:var(--c);font-style:italic} .tk-f{color:var(--f)} .tk-b{color:var(--b)}

/* editor */
.ed{position:relative;background:var(--code-bg);border-radius:12px;display:flex;font:14px/1.6 var(--mono);overflow:hidden;border:2px solid transparent}
.ed:focus-within{border-color:var(--accent)}
.ed .gut{flex:none;width:46px;padding:10px 8px 10px 0;text-align:right;color:var(--code-gutter);user-select:none;overflow:hidden;white-space:pre}
.ed .area{position:relative;flex:1;min-width:0}
.ed pre,.ed textarea{margin:0;padding:10px 12px 10px 4px;font:inherit;line-height:inherit;white-space:pre;tab-size:4;border:0;letter-spacing:0;word-spacing:0}
.ed pre{position:absolute;inset:0;overflow:hidden;color:var(--code-ink);pointer-events:none}
.ed textarea{position:relative;display:block;width:100%;min-height:200px;resize:vertical;background:transparent;color:transparent;caret-color:#fff;outline:none;overflow:auto}
.ed textarea::selection{background:rgba(137,180,250,.35);color:transparent}
@media (max-width:640px){.ed,.codeview{font-size:13px}.ed textarea{font-size:16px;line-height:1.5}.ed pre,.ed .gut{font-size:16px;line-height:1.5}}
.runbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.runbar .sp{flex:1}
.console{background:#0b0d13;color:#d8dbe6;border-radius:12px;font:14px/1.55 var(--mono);padding:12px 14px;min-height:56px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .err{color:#ff8787}
.console .hint{color:#f6c453;font-family:var(--sans);display:block;margin-top:6px}
.console .dim{color:#6c7393}
.console .inrow{display:flex;gap:6px;margin-top:4px}
.console .inrow input{flex:1;background:#1d2130;color:#fff;border:1px solid #3a4160;border-radius:6px;padding:4px 8px;font:inherit}
.files{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.file{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--paper)}
.file .fh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);font:600 13px var(--mono)}
.file .fh .sp{flex:1}
.file textarea{width:100%;border:0;min-height:80px;padding:8px 10px;font:13px/1.5 var(--mono);background:var(--paper);color:var(--ink);resize:vertical;outline:none;white-space:pre}
.file.changed .fh{background:var(--ok-soft)}

/* examples */
.extabs,.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .lv{font-size:11px;padding:1px 7px;border-radius:999px}

      html: "<p><strong>Demand</strong> is the quantity of a good or service that consumers are <strong>willing and able</strong> to buy at each possible price over a <strong>period of time</strong>. Each part of this definition matters in an exam.</p>" +
        "<ul><li><strong>Willing:</strong> consumers must want the product at that price.</li>" +
        "<li><strong>Able:</strong> they must have the income or credit to pay. A student who wants a QAR 6,000 laptop but has QAR 800 does not create demand for it. Desire backed by the ability to pay is called <strong>effective demand</strong>.</li>" +
        "<li><strong>At each price:</strong> demand is a whole schedule, not a single number. This is why we draw it as a curve.</li>" +
        "<li><strong>Over a period of time:</strong> 400 coffees a day is very different to 400 coffees a month.</li></ul>" +
        "<p>A <strong>demand schedule</strong> lists the quantity demanded at each price. Below is a schedule for iced lattes at a cafe in Msheireb Downtown Doha.</p>" +
        "<table><thead><tr><th>Price (QAR)</th><th>Quantity demanded per day</th></tr></thead><tbody>" +
        "<tr><td>25</td><td>120</td></tr><tr><td>22</td><td>170</td></tr><tr><td>19</td><td>230</td></tr><tr><td>16</td><td>300</td></tr><tr><td>13</td><td>380</td></tr></tbody></table>" +
        "<p>Plotting these points with price on the vertical axis and quantity on the horizontal axis gives the <strong>demand curve</strong>. Market demand is the sum of all individual consumers' demand at each price.</p>",
      diagram: { type: "sd", show: "demand", d: 0, s: 0, title: "A demand curve: price on the vertical axis, quantity on the horizontal", labels: true }
    },
    {
      h: "2. The law of demand: why the curve slopes downwards",
      html: "<p>The <strong>law of demand</strong> states that, ceteris paribus, when price rises quantity demanded falls, and when price falls quantity demanded rises. Strong candidates can explain <em>why</em>, using three ideas:</p>" +
        "<ul><li><strong>Substitution effect:</strong> when the price of a good rises it becomes relatively more expensive than alternatives, so some consumers switch to substitutes. If a Doha gym raises its monthly fee, some members move to a rival gym or exercise outdoors.</li>" +
        "<li><strong>Income effect:</strong> a higher price reduces consumers' real income (their purchasing power), so they can afford fewer units. A family with a fixed QAR 1,500 weekly food budget buys less meat when its price rises.</li>" +
        "<li><strong>Diminishing marginal utility:</strong> each extra unit gives less extra satisfaction, so consumers will only buy more if the price falls. The third shawarma at lunch is worth less to you than the first.</li></ul>" +
        "<p>Put together, these explain the <strong>inverse relationship</strong> between price and quantity demanded, which gives the downward sloping curve.</p>" +
        "<p><strong>Expert note:</strong> a few products appear to break the law. <em>Veblen goods</em> (luxury watches, designer handbags) can attract more buyers at higher prices because a high price signals status. Consumers may also buy more when prices rise if they expect further rises (speculative demand, e.g. property or gold). In the exam treat these as exceptions to evaluate with, not as the normal case.</p>"
    },
    {
      h: "3. Movement along the curve vs a shift of the curve",
      html: "<p>This is the single most tested idea in the demand topic. The rule is simple:</p>" +
        "<table><thead><tr><th></th><th>Movement along the curve</th><th>Shift of the curve</th></tr></thead><tbody>" +
        "<tr><td><strong>Cause</strong></td><td>A change in the good's <strong>own price</strong> only</td><td>A change in <strong>any other factor</strong> (incomes, substitutes, tastes, advertising...)</td></tr>" +
        "<tr><td><strong>Name</strong></td><td>Extension (price falls) or contraction (price rises)</td><td>Increase (shift right) or decrease (shift left)</td></tr>" +
        "<tr><td><strong>What changes</strong></td><td>Quantity demanded</td><td>Demand (at every price)</td></tr>" +
        "<tr><td><strong>On the diagram</strong></td><td>Move between two points on D1</td><td>Draw a new curve D2</td></tr></tbody></table>" +
        "<p>If Ooredoo cuts the price of a mobile data bundle from QAR 100 to QAR 80, more bundles are bought: this is an <strong>extension of demand</strong>, a movement down the existing curve. If a rival network's price rises instead, Ooredoo sells more bundles <em>at the same price of QAR 100</em>: the whole curve has <strong>shifted to the right</strong>.</p>" +
        "<p><strong>Exam language:</strong> say 'quantity demanded rises' for a movement and 'demand increases' for a shift. Examiners reward precise terminology.</p>",
      diagram: { type: "sd", show: "demand", move: "up", title: "A rise in the good's own price: contraction along D1", labels: true }
    },
    {
      h: "4. The factors that shift demand (specification list)",
      html: "<p>The specification lists the factors below. Learn the direction of each one and a business example.</p>" +
        "<table><thead><tr><th>Factor</th><th>Change</th><th>Effect on demand</th><th>Example</th></tr></thead><tbody>" +
        "<tr><td>Price of a <strong>substitute</strong></td><td>Rises</td><td>Increases (shift right)</td><td>Uber fares rise, so demand for Careem rides increases.</td></tr>" +
        "<tr><td>Price of a <strong>complement</strong></td><td>Rises</td><td>Decreases (shift left)</td><td>Petrol prices rise, so demand for large 4x4 cars decreases.</td></tr>" +
        "<tr><td><strong>Consumer incomes</strong></td><td>Rise</td><td>Increases for normal goods; decreases for inferior goods</td><td>Higher salaries raise demand for fine dining, but reduce demand for budget own-label groceries.</td></tr>" +
        "<tr><td><strong>Fashion, tastes and preferences</strong></td><td>Move towards the product</td><td>Increases</td><td>A health trend raises demand for protein snacks and plant-based milk.</td></tr>" +
        "<tr><td><strong>Advertising and branding</strong></td><td>Successful campaign</td><td>Increases, and can make demand less price sensitive</td><td>A social media campaign with an influencer raises demand for a local perfume brand.</td></tr>" +
        "<tr><td><strong>Demographic changes</strong></td><td>Growth in a population group</td><td>Increases demand for products that group buys</td><td>A growing expatriate family population raises demand for international school places.</td></tr>" +
        "<tr><td><strong>External shocks</strong></td><td>Unexpected event</td><td>Can increase or decrease</td><td>A pandemic cut demand for flights but raised demand for delivery apps.</td></tr>" +
        "<tr><td><strong>Seasonality</strong></td><td>Time of year</td><td>Predictable rises and falls</td><td>Demand for hotel rooms in Doha rises in the cooler winter months and during major events; demand for dates and sweets rises during Ramadan and Eid.</td></tr></tbody></table>" +
        "<p><strong>Watch out:</strong> an income rise does not always shift demand right. Normal goods see an increase; <strong>inferior goods</strong> (cheaper alternatives people trade up from) see a decrease. This links forward to income elasticity of demand.</p>",
      diagram: { type: "sd", show: "demand", d: 1, title: "An increase in demand: D1 shifts right to D2", labels: true }
    },
    {
      h: "5. Showing each change on a diagram",
      html: "<p>Every demand diagram needs: axes labelled <strong>Price</strong> (vertical) and <strong>Quantity</strong> (horizontal), the original curve <strong>D1</strong>, and either a new point on D1 (movement) or a new curve <strong>D2</strong> (shift), with an arrow showing the direction.</p>" +
        "<ul><li><strong>Increase in demand:</strong> D2 to the right of D1. At the original price P1, consumers now want a larger quantity.</li>" +
        "<li><strong>Decrease in demand:</strong> D2 to the left of D1. At P1, consumers now want a smaller quantity.</li>" +
        "<li><strong>Extension:</strong> lower price, move down D1 to a larger quantity.</li>" +
        "<li><strong>Contraction:</strong> higher price, move up D1 to a smaller quantity.</li></ul>" +
        "<p>When a supply curve is also drawn, a shift in demand changes the <strong>equilibrium</strong>. An increase in demand, with supply unchanged, raises both equilibrium price and quantity. A decrease in demand lowers both. Use the lab below to test this: shift only the demand curve and watch both P and Q move in the same direction as the shift.</p>" +
        "<p><strong>Expert tip:</strong> a useful way to think of a shift right is 'more is demanded at every price' and also 'consumers are willing to pay more for every quantity'. Both readings are correct and both help in analysis.</p>",
      diagram: { type: "sd", show: "both", d: -1, title: "A decrease in demand with supply unchanged: price and quantity both fall", labels: true },
      widget: "sdlab"
    },
    {
      h: "6. Applying demand to businesses: chains of reasoning",
      html: "<p>Marks for analysis come from <strong>chains of reasoning</strong>: linked steps that connect the cause to a consequence for the business. A good chain usually has three or four links.</p>" +
        "<p><strong>Example:</strong> Qatar experiences a large rise in visitor numbers during a major sporting event.</p>" +
        "<ul><li><strong>Link 1 (factor):</strong> an external shock and a temporary demographic change raise the number of potential customers in Doha.</li>" +
        "<li><strong>Link 2 (shift):</strong> demand for hotel rooms shifts to the right, so at every room rate more rooms are wanted.</li>" +
        "<li><strong>Link 3 (market effect):</strong> with supply of rooms fixed in the short run, equilibrium price rises sharply, from QAR 600 to perhaps QAR 1,500 a night.</li>" +
        "<li><strong>Link 4 (business consequence):</strong> revenue and profit rise strongly, but the hotel may need extra temporary staff and must avoid damaging its reputation through price gouging.</li></ul>" +
        "<p><strong>Getting to evaluation:</strong> ask 'it depends on...'. The size of the effect depends on how big the shift is, how long it lasts (temporary shock or permanent change in tastes), how price sensitive customers are (PED), whether the business can increase supply, and how competitors react. A judgement such as 'the impact is likely to be large but short-lived because...' scores higher than a list.</p>" +
        "<p><strong>Business responses to a fall in demand:</strong> promotion and advertising to shift demand back, product development to follow new tastes, cutting price (which only causes an extension along the new curve), reducing output and costs, or finding new market segments.</p>"
    },
    {
      h: "7. Expert level: separating effects and handling exam traps",
      html: "<p><strong>Trap 1: price causes a shift?</strong> A fall in the price of iPhones does <em>not</em> shift iPhone demand. It causes an extension. But it <em>does</em> shift demand for complements (iPhone cases, AirPods) to the right and for substitutes (Samsung Galaxy phones) to the left. Always ask: whose price changed, and which market am I drawing?</p>" +
        "<p><strong>Trap 2: expected price changes.</strong> If consumers expect prices to rise next month (e.g. ahead of a new tax), demand <em>today</em> shifts right as people buy in advance. This is a change in expectations, not a change in today's price, so it is a shift.</p>" +
        "<p><strong>Trap 3: double counting.</strong> A shift in demand changes price, and that price change moves the market along the <em>supply</em> curve (an extension of supply). Do not say the demand curve shifts again because of the higher price.</p>" +
        "<p><strong>Trap 4: magnitude.</strong> Not all shifts are equal. A small change in tastes may barely matter; a pandemic can remove most of a market overnight. Use data in the case (e.g. 'bookings fell 40%') to judge size.</p>" +
        "<p><strong>Using advertising and branding deeply:</strong> successful branding does two things. It shifts demand to the right (more customers at every price) <em>and</em> it makes demand more price inelastic (the curve becomes steeper) because loyal customers see fewer close substitutes. This allows a business such as a premium coffee chain to charge QAR 28 for a drink that costs a few riyals to make.</p>",
      diagram: { type: "sd", show: "both", d: 1, title: "Successful branding: demand shifts right, raising price and quantity", labels: true }
    }
  ],

        "<tr><td>4</td><td>80</td></tr><tr><td>6</td><td>130</td></tr><tr><td>8</td><td>175</td></tr><tr><td>10</td><td>210</td></tr><tr><td>12</td><td>240</td></tr></tbody></table>" +

    {

        "<ul><li><strong>The profit incentive:</strong> at a higher price, each unit sold earns more revenue, so producing more becomes more profitable. Firms switch resources towards the product. If the price of air conditioning servicing rises in summer, engineering firms move staff from other jobs to servicing.</li>" +
        "<li><strong>Rising costs of extra output:</strong> producing more in the short run means overtime pay at higher rates, using older, less efficient machinery, or paying more for scarce materials. A firm will only supply these extra, more expensive units if the price covers the extra cost.</li>" +
        "<li><strong>New entrants:</strong> a higher market price attracts new firms (and existing firms from other markets), increasing quantity supplied in the market as a whole.</li></ul>" +
        "<p>So price and quantity supplied have a <strong>positive</strong> (direct) relationship, giving an upward sloping curve.</p>" +
        "<p><strong>Expert note:</strong> some supply is fixed in the short run. The number of seats in a stadium or rooms in a hotel cannot increase quickly, so the short run supply curve is very steep (or vertical). This explains why prices jump so sharply when demand rises for events.</p>",

        "<tr><td><strong>What changes</strong></td><td>Quantity supplied</td><td>Supply (at every price)</td></tr></tbody></table>" +
        "<p><strong>Reading a shift correctly:</strong> a shift to the <strong>right</strong> means more is supplied at every price, or equivalently that firms are willing to supply each quantity at a <em>lower</em> price because costs have fallen. A shift to the <strong>left</strong> means less is supplied at every price, or firms need a <em>higher</em> price for each quantity because costs have risen.</p>" +
        "<p><strong>Common confusion:</strong> a leftward shift of supply is drawn <em>above</em> the original curve. Students sometimes call this 'supply going up' and wrongly think it means an increase. Use 'left' and 'right', never 'up' and 'down', for supply shifts.</p>",

        "<p><strong>The key link:</strong> almost every supply factor works through <strong>costs per unit</strong>. Lower unit costs mean each unit is more profitable at any price, so firms supply more. Higher unit costs do the opposite. If you can explain the effect on costs, you can explain the shift.</p>",

        "<p><strong>Who pays?</strong> The price consumers pay usually rises by <em>less</em> than the tax. Part of the tax (the consumer burden) is passed on through a higher price; the rest (the producer burden) is absorbed by the firm as a lower price received after tax. If demand is price <strong>inelastic</strong> (e.g. cigarettes) most of the tax is passed on to consumers; if demand is price <strong>elastic</strong> the firm absorbs more, squeezing its profit margin.</p>" +

    { term: "Excess demand", def: "A situation where, at the current price, quantity demanded is greater than quantity supplied (a shortage). It occurs when the price is below equilibrium." },

    {
      h: "1. What equilibrium means",
      html: "<p>A market brings together buyers (demand) and sellers (supply). Demand slopes downwards because a lower price makes a product more affordable and attractive compared with substitutes. Supply slopes upwards because a higher price makes production more profitable, so firms are willing to produce more.</p>" +
        "<p>The <strong>equilibrium</strong> is where the two curves cross. At this price the plans of buyers and sellers match exactly: every unit firms want to sell at that price, consumers want to buy. There is <strong>no tendency for the price to change</strong> unless one of the curves shifts.</p>" +
        "<table><thead><tr><th>Price of a cup of karak (QAR)</th><th>Quantity demanded per day</th><th>Quantity supplied per day</th><th>Situation</th></tr></thead><tbody>" +
        "<tr><td>2</td><td>900</td><td>300</td><td>Excess demand of 600</td></tr>" +
        "<tr><td>3</td><td>700</td><td>500</td><td>Excess demand of 200</td></tr>" +
        "<tr><td>4</td><td>600</td><td>600</td><td><strong>Equilibrium</strong></td></tr>" +
        "<tr><td>5</td><td>450</td><td>750</td><td>Excess supply of 300</td></tr>" +
        "<tr><td>6</td><td>300</td><td>900</td><td>Excess supply of 600</td></tr></tbody></table>" +
        "<p>In this Doha karak market the equilibrium price is <strong>QAR 4</strong> and the equilibrium quantity is <strong>600 cups per day</strong>. Excess demand or excess supply is always measured as the <strong>horizontal gap</strong> between quantity demanded and quantity supplied at a given price.</p>",
      diagram: { type: "sd", d: 0, s: 0, title: "Market equilibrium at P1 and Q1", show: "both", labels: true }
    },
    {

      html: "<p><strong>Excess supply (price above equilibrium).</strong> If a phone retailer prices a model at QAR 3,200 when the equilibrium is QAR 2,800, stock builds up in stores. Firms cut prices to clear unsold stock. As the price falls, quantity demanded <em>extends</em> (movement down the demand curve) and quantity supplied <em>contracts</em> (movement down the supply curve) until the surplus disappears at equilibrium.</p>" +
        "<p><strong>Excess demand (price below equilibrium).</strong> If concert tickets in Lusail are priced too low, queues form, tickets sell out and resale prices rise. Sellers realise they can charge more. As the price rises, quantity demanded <em>contracts</em> and quantity supplied <em>extends</em> until the shortage is eliminated.</p>" +
        "<p>The price mechanism performs three functions:</p><ul>" +
        "<li><strong>Signalling:</strong> a rising price tells producers that consumers value the product more and tells consumers it is scarce.</li>" +
        "<li><strong>Rationing:</strong> a higher price reduces quantity demanded, so the limited supply goes to those most willing and able to pay.</li>" +
        "<li><strong>Incentive:</strong> a higher price raises potential profit, so firms extend output and, in the long run, new firms enter the market.</li></ul>" +
        "<p>In an exam, a strong answer uses all three words and links each to the specific market in the case. Note that the price mechanism does not always work quickly: contracts, menu costs, capacity limits and pricing decisions by firms can leave shortages or surpluses for some time.</p>",
      diagram: { type: "sd", price: "high", title: "Price above equilibrium creates excess supply" }

    {
      h: "3. Drawing a supply and demand diagram step by step",

        "<p><strong>Key rule:</strong> a change in the price of the product itself never shifts its own curves. It causes a <em>movement along</em> them. Only non-price factors (income, tastes, costs, technology, taxes, prices of related goods, weather) shift a curve.</p>" +

    {
      h: "6. Interpreting real business scenarios",
      html: "<p><strong>Coffee bean harvest failure.</strong> Frost in Brazil reduces coffee bean supply (S shifts left). World prices of beans rise. A Doha café chain faces higher costs, so the supply of café drinks also shifts left. The chain must decide whether to raise prices (risking lost customers to rivals) or absorb the cost (reducing margins). The answer depends on how loyal customers are and how sensitive they are to price, which links to PED in the next topic.</p>" +

        "<p><strong>New phone launch.</strong> When a manufacturer launches a new flagship model, demand for the previous model shifts left (consumers switch to the substitute) while retailers still hold stock. Excess supply at the old price leads to discounting. At the same time, launch stock of the new model is often limited, so excess demand appears: pre-order queues, waiting lists and resale prices above the official price.</p>" +

  learn: [
    {
      h: "1. What PED measures and how to calculate it",
      html: "<p><strong>Price elasticity of demand</strong> measures how strongly customers react to a change in the product's own price. It compares two percentage changes, so it has <strong>no units</strong> and can be used to compare products with very different prices.</p>" +
        "<p><strong>PED = % change in quantity demanded ÷ % change in price</strong></p>" +
        "<p>Each percentage change is calculated as <strong>(new minus old) ÷ old x 100</strong>. Always divide by the <em>original</em> value.</p>" +
        "<p><strong>Worked example.</strong> A Doha cinema raises its ticket price from QAR 40 to QAR 46. Weekly tickets sold fall from 5,000 to 4,400.</p><ul>" +

        "<li>% change in quantity demanded = (4,400 minus 5,000) ÷ 5,000 x 100 = <strong>-12%</strong></li>" +
        "<li>PED = -12 ÷ 15 = <strong>-0.8</strong></li></ul>" +
        "<p>Interpretation: a 1% rise in price leads to a 0.8% fall in quantity demanded. Demand is <strong>price inelastic</strong> because 0.8 is less than 1.</p>" +

    {
      h: "2. Interpreting the value and the negative sign",

        "<p>By convention we judge elasticity using the <strong>magnitude</strong> (the size, ignoring the sign). A PED of -2.5 is <em>more</em> elastic than a PED of -0.5, even though -2.5 is the smaller number. In exams, keep the minus sign in your calculated answer but talk about the size when you interpret it.</p>" +

        "<tr><td>-1</td><td>Unitary</td><td>% change in Qd equals % change in P</td><td>Rectangular hyperbola</td></tr>" +
        "<tr><td>Between -1 and minus infinity</td><td>Elastic</td><td>% change in Qd greater than % change in P</td><td>Relatively flat</td></tr>" +
        "<tr><td>Infinity</td><td>Perfectly elastic</td><td>Any price rise loses all sales</td><td>Horizontal</td></tr></tbody></table>" +
        "<p><strong>Expert point:</strong> steepness is only a rough guide. Elasticity actually changes along a straight line demand curve: demand is elastic at high prices and inelastic at low prices. So only compare slopes when two curves are drawn on the same axes through the same point.</p>",

    {

        "<tr><td><strong>Proportion of income</strong></td><td>The product takes a large share of income</td><td>A 10% rise in the price of a car is noticed far more than a 10% rise in the price of salt</td></tr>" +
        "<tr><td><strong>Necessity or luxury</strong></td><td>The product is a luxury that can be gone without</td><td>Designer handbags are more elastic than basic medicines or bread</td></tr>" +
        "<tr><td><strong>Habit and addiction</strong></td><td>The product is not habit forming</td><td>Cigarettes and daily coffee are inelastic because buyers are hooked or in a routine</td></tr>" +

        "<p>The single most important factor is usually <strong>substitutes</strong>: most of the other factors work by affecting how easily consumers can or will switch. Much of a firm's marketing (branding, loyalty schemes, product differentiation, subscription contracts) is designed to make its demand <strong>less price elastic</strong>, giving it more pricing power.</p>"
    },
    {
      h: "4. PED and total revenue",
      html: "<p><strong>Total revenue (TR) = price x quantity.</strong> A price change has two opposite effects on revenue: each unit earns more (or less), but fewer (or more) units are sold. PED tells you which effect is bigger.</p>" +

      model: "<p><strong>[Knowledge]</strong> Price elasticity of demand measures the responsiveness of quantity demanded to a change in price: % change in Qd ÷ % change in price. When demand is price inelastic (magnitude less than 1), a price rise increases total revenue because quantity falls by a smaller percentage than price rises.</p>" +
        "<p><strong>[Application]</strong> The rise from QAR 180 to QAR 198 is 10%. With PED of -0.5, the number of customers is expected to fall by 5%, from 420,000 to 399,000. Total revenue would rise from 180 x 420,000 = QAR 75,600,000 a month to 198 x 399,000 = QAR 79,002,000, an increase of about QAR 3.4 million a month, or roughly QAR 40.8 million a year to help fund 5G investment.</p>" +

TOPICS.push({
  id: "yed", order: 5, title: "Income elasticity of demand", icon: "Y",
  summary: "How sensitive demand is to a change in consumer income. YED tells a business whether its products are inferior, normal necessities or luxuries, and so how its sales are likely to behave in a boom or a recession.",
  examTip: "In any YED question, state the sign AND the size of your answer, name the type of good, then apply it to the business in the case (what happens to sales, revenue, stock and staffing if incomes change). A number on its own earns only the calculation marks.",

  keyTerms: [
    { term: "Income elasticity of demand (YED)", def: "A measure of the responsiveness of quantity demanded to a change in real income, calculated as the percentage change in quantity demanded divided by the percentage change in income." },
    { term: "Real income", def: "Income adjusted for inflation, showing the quantity of goods and services that income can actually buy." },
    { term: "Normal good", def: "A good with positive YED: demand rises when income rises and falls when income falls." },
    { term: "Normal necessity", def: "A normal good with YED between 0 and 1: demand rises with income, but by a smaller percentage than income (income inelastic)." },
    { term: "Luxury good", def: "A normal good with YED greater than 1: demand rises by a larger percentage than income (income elastic)." },
    { term: "Inferior good", def: "A good with negative YED: demand falls as income rises because consumers switch to preferred, more expensive alternatives." },
    { term: "Business cycle", def: "The repeated pattern of growth (boom) and decline (recession) in economic activity and therefore in incomes over time." },
    { term: "Product portfolio", def: "The range of products a business sells; balancing products with different YEDs spreads the risk of changing incomes." },
    { term: "Trading up / trading down", def: "Consumers switching to higher quality, more expensive products when incomes rise (trading up), or to cheaper alternatives when incomes fall (trading down)." }
  ],

  learn: [
    { h: "1. What YED measures and why it matters",
      html: `<p>Price elasticity of demand looks at what happens when the <em>business</em> changes its price. Income elasticity of demand looks at something the business <strong>cannot control</strong>: the income of its customers. When an economy grows, wages, bonuses and employment rise, so households have more real income to spend. In a recession the opposite happens.</p>
<p><strong>YED measures how strongly quantity demanded responds to a change in real income, ceteris paribus.</strong> It answers the question every manager asks when economists forecast a boom or a slowdown: <em>"What will happen to our sales?"</em></p>
<ul>
<li>A Doha jewellery retailer, a five star hotel and an airline selling business class seats will see demand rise sharply when incomes grow.</li>
<li>A supermarket selling rice, bread and milk will see demand change only a little.</li>
<li>A budget bus service or a supermarket own-label value range may actually sell <strong>more</strong> when incomes fall, as customers trade down.</li>
</ul>
<p>Income changes shift the whole demand curve: a change in income is a <strong>non-price factor</strong>, so it causes a <strong>shift</strong> of demand, not a movement along it. YED tells us the <em>direction</em> and the <em>size</em> of that shift.</p>`,
      diagram: { type: "sd", d: 1, s: 0, show: "both", title: "Rising incomes shift demand right for a normal good", labels: true } },

    { h: "2. The formula and how to calculate it",
      html: `<p><strong>YED = % change in quantity demanded / % change in income</strong></p>
<p>Each percentage change is calculated as <strong>(new value minus old value) / old value x 100</strong>. Always work out the two percentage changes first, then divide.</p>
<table><thead><tr><th>Step</th><th>Worked example: premium gym memberships in Doha</th></tr></thead>
<tbody>
<tr><td>1. % change in income</td><td>Average monthly income rises from QAR 20,000 to QAR 21,000. (21,000 minus 20,000) / 20,000 x 100 = <strong>+5%</strong></td></tr>
<tr><td>2. % change in quantity demanded</td><td>Memberships rise from 800 to 920. (920 minus 800) / 800 x 100 = <strong>+15%</strong></td></tr>
<tr><td>3. Divide</td><td>YED = +15 / +5 = <strong>+3.0</strong></td></tr>
<tr><td>4. Interpret</td><td>Positive and greater than 1, so premium gym membership is a <strong>luxury (income elastic)</strong> service. Each 1% rise in income raises demand by about 3%.</td></tr>
</tbody></table>
<p>The formula can be <strong>rearranged</strong> for forecasting, which is the most common exam use:</p>
<ul>
<li><strong>% change in quantity demanded = YED x % change in income</strong></li>
<li><strong>% change in income = % change in quantity demanded / YED</strong></li>
<li><strong>New sales = old sales x (1 + % change / 100)</strong></li>
</ul>
<p>Keep the sign. A YED of -0.5 with a 4% rise in income gives -2%, a fall in demand. YED has <strong>no units</strong>; write it as a plain number, usually to two decimal places.</p>
<p>Use the YED lab below to test different income and quantity changes and see how the classification changes.</p>`,
      widget: "yedlab" },

    { h: "3. Interpreting the sign and the size",
      html: `<p>With YED, unlike PED, <strong>the sign carries meaning</strong>. Never drop it.</p>
<table><thead><tr><th>YED value</th><th>Type of good</th><th>What happens when incomes rise 10%</th><th>Doha examples</th></tr></thead>
<tbody>
<tr><td><strong>Less than 0</strong> (negative)</td><td>Inferior good</td><td>Demand falls (YED -0.6 gives -6%)</td><td>Supermarket value range rice, public bus travel, second-hand phones</td></tr>
<tr><td><strong>0</strong></td><td>Income neutral (rare)</td><td>No change</td><td>Salt, basic medicines (close to zero)</td></tr>
<tr><td><strong>Between 0 and 1</strong></td><td>Normal necessity (income inelastic)</td><td>Demand rises by less than 10% (YED 0.4 gives +4%)</td><td>Bread, fresh milk, mobile data, petrol</td></tr>
<tr><td><strong>Exactly 1</strong></td><td>Unitary income elastic</td><td>Demand rises by exactly 10%</td><td>Boundary case</td></tr>
<tr><td><strong>Greater than 1</strong></td><td>Luxury (income elastic)</td><td>Demand rises by more than 10% (YED 2.5 gives +25%)</td><td>Fine dining, designer fashion, business class flights, luxury cars, foreign holidays</td></tr>
</tbody></table>
<p>Two ideas help interpretation at expert level:</p>
<ul>
<li><strong>Sign = direction.</strong> Positive means demand moves the same way as income; negative means it moves the opposite way.</li>
<li><strong>Size = sensitivity.</strong> The further YED is from zero, the more demand swings with the business cycle. A YED of 3.0 is far more volatile than a YED of 1.2, even though both are luxuries.</li>
</ul>
<p>Inferior does <strong>not</strong> mean poor quality or unpopular. It simply means that, as income rises, consumers <em>prefer</em> to switch to something else. Value airlines can be very profitable precisely because they gain customers when incomes fall.</p>
<p>Also notice that the necessity/luxury labels come from the <strong>number</strong>, not from opinion. If the data show YED of 1.4 for smartphones, then in that market smartphones behave as a luxury, even if many people feel they "need" one.</p>`,
      diagram: { type: "sd", d: -1, s: 0, show: "demand", title: "Rising incomes shift demand left for an inferior good", labels: true } },

    { h: "4. Factors influencing YED",
      html: `<p>A strong answer explains <em>why</em> a product has the YED it has. The main factors are:</p>
<ul>
<li><strong>Whether the product meets a basic need or a want.</strong> Essentials such as food staples and utilities are bought whatever the income, so YED is low. Discretionary spending on leisure, travel and fashion is cut first when incomes fall and grows fastest when incomes rise.</li>
<li><strong>The income level of the customers.</strong> YED is not fixed. A car may be a luxury for a low income worker but a necessity for a high income professional. As a country like Qatar becomes richer, many products move from luxury towards necessity.</li>
<li><strong>Availability of better or cheaper alternatives.</strong> Products are inferior only because a preferred substitute exists. If there is a premium version to trade up to, the basic version is likely to have a low or negative YED.</li>
<li><strong>Proportion of income spent on the product.</strong> Items that take a large share of the budget (holidays, cars, furniture) are postponed when incomes fall, so they tend to be more income elastic.</li>
<li><strong>Time period.</strong> Consumers take time to change habits. In the short run demand may barely react; over a year or more, people upgrade cars, move home or change their regular supermarket, so YED is usually larger in the long run.</li>
<li><strong>Brand image and status.</strong> Products bought to signal success (designer labels, luxury watches) tend to have high YED, because extra income is spent on status.</li>
<li><strong>Consumer confidence and expectations.</strong> If people expect incomes to keep rising, they spend more on luxuries now; fear of job losses makes them cut back even before incomes actually fall.</li>
</ul>`,
    },

    { h: "5. Significance of YED for businesses",
      html: `<p>YED is a <strong>planning tool</strong>. Combined with a forecast of income growth, it lets managers estimate future sales and prepare.</p>
<table><thead><tr><th>Decision</th><th>How YED helps</th><th>Doha application</th></tr></thead>
<tbody>
<tr><td><strong>Sales forecasting</strong></td><td>% change in sales = YED x forecast % change in income. Forecasts feed into budgets, cash flow and production plans.</td><td>A hotel with YED 2.0 expects a 6% fall in bookings if visitor incomes fall 3%.</td></tr>
<tr><td><strong>Boom and recession planning</strong></td><td>Luxury sellers expand in a boom and cut costs early in a recession. Inferior good sellers do the opposite.</td><td>A supermarket expands its value range when a slowdown is forecast.</td></tr>
<tr><td><strong>Product portfolio balance</strong></td><td>Holding products with different YEDs smooths revenue across the business cycle, reducing risk.</td><td>A fashion retailer sells a designer line (YED 2.5) alongside a basics own label (YED 0.3).</td></tr>
<tr><td><strong>Targeting</strong></td><td>Firms selling luxuries target segments and countries where incomes are growing fastest.</td><td>A car dealer targets young professionals whose salaries are rising quickly.</td></tr>
<tr><td><strong>Pricing</strong></td><td>In a boom, luxury demand shifts right so firms can raise prices or cut discounts; in a recession they may need offers or a cheaper version.</td><td>A restaurant adds a lower priced set menu when diners' incomes fall.</td></tr>
<tr><td><strong>Stock, staffing and capacity</strong></td><td>Forecast changes tell managers how much stock to order, how many staff to roster and whether to invest in capacity.</td><td>A jeweller orders less high value stock ahead of a forecast fall in incomes, protecting cash flow.</td></tr>
</tbody></table>
<p>The deeper point is <strong>risk</strong>. A business that sells only income elastic products enjoys rapid growth in a boom but faces a sharp fall in revenue in a recession. Because fixed costs such as rent and salaries do not fall with sales, profit falls even faster than revenue, which can threaten survival. Understanding YED lets the business plan for this.</p>`
    },

    { h: "6. Combining YED with PED in decisions",
      html: `<p>Top answers use <strong>both</strong> elasticities. YED tells you what will happen to demand when incomes change (a shift of the curve). PED tells you how customers will react if the business then changes its own price (a movement along the curve).</p>
<table><thead><tr><th></th><th>Price inelastic (|PED| &lt; 1)</th><th>Price elastic (|PED| &gt; 1)</th></tr></thead>
<tbody>
<tr><td><strong>Low or negative YED</strong></td><td>Very stable revenue; a price rise increases total revenue. Example: fresh milk, mobile data.</td><td>Stable through the cycle but customers are price sensitive; a price cut can grow revenue. Example: supermarket value range.</td></tr>
<tr><td><strong>High YED (luxury)</strong></td><td>Revenue swings with the cycle, but loyal, brand driven buyers allow premium pricing. Example: a famous designer label.</td><td>Most exposed: demand falls in a recession and customers are also price sensitive. Price cuts can win back volume. Example: package holidays.</td></tr>
</tbody></table>
<p><strong>Combining the two effects numerically.</strong> If a hotel faces a fall in incomes of 4% (YED 2.5) and cuts its price by 8% (PED -1.5):</p>
<ul>
<li>Income effect: 2.5 x -4 = <strong>-10%</strong></li>
<li>Price effect: -1.5 x -8 = <strong>+12%</strong></li>
<li>Quick estimate (add the effects, ceteris paribus): -10 + 12 = <strong>+2%</strong></li>
<li>More precise (apply one after the other): 2,000 room nights x 0.90 = 1,800, then 1,800 x 1.12 = <strong>2,016</strong> (+0.8%)</li>
</ul>
<p>Either method is accepted if your working is clear; the precise method matters most when the changes are large. Then consider total revenue: 2,016 x QAR 552 = QAR 1,112,832, compared with 1,800 x QAR 600 = QAR 1,080,000 if the hotel had done nothing. The price cut partly offsets the recession, but revenue is still below the original QAR 1,200,000, and profit also depends on the extra cost of serving more guests.</p>`
    },

    { h: "7. Limitations of YED and how to evaluate it",
      html: `<p>Evaluation marks come from questioning how reliable YED is and how much weight a manager should put on it.</p>
<ul>
<li><strong>Based on past data.</strong> YED is estimated from previous income and sales changes. Tastes, technology and competition change, so past values may not hold.</li>
<li><strong>Ceteris paribus rarely holds.</strong> When incomes change, prices, competitor actions, advertising and population (important in Qatar, where the expatriate workforce changes in size) often change at the same time, so it is hard to isolate the effect of income.</li>
<li><strong>Income forecasts may be wrong.</strong> A precise YED multiplied by an inaccurate income forecast still gives an inaccurate sales forecast.</li>
<li><strong>YED changes over time and across segments.</strong> An average YED hides different behaviour by different customer groups. A product may be a luxury for one segment and a necessity for another.</li>
<li><strong>Which income?</strong> Real disposable income matters, not nominal income. If wages rise 5% but inflation is 5%, real income has not changed.</li>
<li><strong>Size of the change.</strong> YED is most reliable for small income changes; large shocks change behaviour in ways the estimate does not capture.</li>
</ul>
<p>A good evaluative judgement might be: <em>"YED is a useful guide to the direction and approximate size of change, so the business should use it to plan stock and staffing, but it should test forecasts against current sales data and keep flexible contracts in case the estimate proves wrong."</em></p>`
    }
  ],

      model: `<p><strong>[Knowledge]</strong> Income elasticity of demand measures the responsiveness of quantity demanded to a change in real income. Signature has a YED of 2.4, so it is a luxury (income elastic), while Everyday has a YED of 0.3, a normal necessity.</p>
<p><strong>[Application]</strong> A 2.5% fall in income would reduce demand for Signature by 2.4 x 2.5 = 6%, but Everyday by only 0.75%. Because Signature provides 65% of revenue, almost all of the risk sits in that range.</p>
<p><strong>[Analysis]</strong> The fall in income shifts the demand curve for Signature to the left. Mall rents and salaries are fixed costs, so a 6% fall in revenue from the main range could cause a proportionally larger fall in profit. This means YED is very useful: it identifies where the business is exposed and how large the effect could be, which supports the finance director's plan to cut Signature stock and avoid unsold, expensive inventory tying up cash.</p>

<p><strong>[Evaluation]</strong> Overall, YED should strongly influence the response because it shows that the business is heavily exposed through its luxury range, and it supports reducing Signature stock and building Everyday as a safer base. However, it should not be used alone: PED shows that targeted promotions on Signature could protect revenue in the short run. The best response is likely to be a mix, with cautious stock levels and short promotions rather than a permanent 10% cut, reviewed monthly as actual sales data replace the forecast.</p>`,
