<tr><td>This means</td><td>Demand shifts right by around 10%; at the current price there is excess demand.</td></tr>
<tr><td>Which leads to</td><td>Waiting lists lengthen, so the dealer can reduce discounts and raise prices towards the new equilibrium.</td></tr>
<tr><td>Therefore</td><td>Both price and volume rise, so total revenue and, with fixed showroom costs, profit margins increase.</td></tr>
</tbody></table>
<p><strong>Two strands, not five.</strong> In a 6 mark 'analyse' question, two well developed chains beat five one-line points. In 'assess' and 'evaluate', develop a chain for each side before weighing them.</p>
<p><strong>Name the curve and the direction.</strong> Say "demand shifts right" or "a contraction along the demand curve", never "demand goes up" without saying which. Precision in the market language is a key marker of strong analysis.</p>`,
      diagram: { type: "sd", d: 1, s: 0, title: "Chain shown on a diagram: higher incomes shift demand right", labels: true }
    },

    { h: "4. Using diagrams in answers",
      html: `<p>A diagram is the fastest way to show analysis of a market change, and examiners credit it when it is <strong>accurate and referred to in the text</strong>.</p>
<ul>
<li><strong>Label everything:</strong> axes (Price, Quantity), curves (D1, D2, S1, S2), equilibrium (P1 Q1, P2 Q2) and an arrow for the shift.</li>
<li><strong>Shift the right curve.</strong> Non-price factors affecting buyers shift demand; costs, technology, taxes, subsidies and the number of sellers shift supply. A change in the product's own price is a movement along a curve, never a shift.</li>
<li><strong>Explain the process,</strong> not just the end point: at the old price there is excess demand (or supply), which pushes the price up (or down) until a new equilibrium is reached.</li>
<li><strong>When both curves shift,</strong> one of price or quantity is uncertain. Say which, then use the case data to argue which shift is larger.</li>
<li><strong>Use PED to explain the slope.</strong> A steep (inelastic) demand curve means a supply shift changes price a lot and quantity a little; a flat (elastic) curve means the reverse. Total revenue rectangles show why.</li>
</ul>
<p>Write a sentence such as "As shown in the diagram, the rise in costs shifts supply left from S1 to S2, raising price from P1 to P2 and reducing quantity from Q1 to Q2." This turns a picture into marks.</p>`,
      diagram: { type: "ped", kind: "inelastic" }
    },

    { h: "5. Using data from a case study",
      html: `<p>Case studies give data so that you can <strong>process</strong> it. The strongest answers do at least one calculation even when not asked to.</p>
<ul>
<li><strong>Turn absolute figures into percentages</strong> to compare: "sales rose 3,000 units" means more as "sales rose 15%".</li>
<li><strong>Calculate an elasticity</strong> if two data points are given, then interpret it: "PED = -0.6, so demand is price inelastic."</li>
<li><strong>Calculate revenue</strong> before and after a change: TR = P x Q. This turns "revenue will rise" into "revenue rises by QAR 48,000 (6%)".</li>
<li><strong>Compare with something:</strong> competitor prices, previous years, market share, industry averages.</li>
<li><strong>Question the data:</strong> sample size, time period, whether it is a forecast, who collected it and whether ceteris paribus held. This is an evaluation route.</li>
</ul>
<p>Avoid copying out data unused. "Sales were 20,000" earns nothing; "sales fell from 20,000 to 17,000 (15%) after a 10% price rise, suggesting PED of -1.5, so the price rise reduced revenue" earns application and analysis together.</p>`
    },

    { h: "6. Evaluation techniques",
      html: `<p>Evaluation is not just "on the other hand". It is <strong>judging</strong>. Use these routes, and combine two or three in a final paragraph.</p>
<table><thead><tr><th>Technique</th><th>Sentence starter</th><th>Example in a market context</th></tr></thead>
<tbody>
<tr><td><strong>It depends on</strong></td><td>"The impact depends mainly on..."</td><td>"...the PED of the product, because an inelastic demand means the tax is largely passed on to consumers."</td></tr>
<tr><td><strong>Short run vs long run</strong></td><td>"In the short run... but in the long run..."</td><td>"In the short run drivers cannot switch fuel, so demand for petrol is inelastic, but over years they buy electric cars, so demand becomes more price elastic."</td></tr>
<tr><td><strong>Magnitude</strong></td><td>"The size of the change matters..."</td><td>"A 2% fall in income with YED 0.3 cuts sales by only 0.6%, a minor effect."</td></tr>
<tr><td><strong>Likelihood</strong></td><td>"How likely is it that..."</td><td>"The forecast is from one bank; if growth is weaker, the boost to luxury sales will not happen."</td></tr>
<tr><td><strong>Ceteris paribus</strong></td><td>"This assumes other factors stay the same, but..."</td><td>"...competitors may cut prices at the same time, offsetting the rise in demand."</td></tr>
<tr><td><strong>Other factors</strong></td><td>"However, X may be more important than Y because..."</td><td>"...for a ride hailing app, driver supply may limit growth more than consumer income."</td></tr>
<tr><td><strong>Justified judgement</strong></td><td>"Overall, ... because ... although this depends on ..."</td><td>"Overall the price rise is likely to raise revenue because PED is -0.4, although this depends on rivals not undercutting."</td></tr>
</tbody></table>
<p><strong>A strong conclusion</strong> does three things: answers the question directly, gives the single most important reason, and states the key condition. It must not simply repeat the arguments already made.</p>`
    },

    { h: "7. Mixed questions: shifts, PED and YED together",
      html: `<p>The hardest questions combine topics. Use this <strong>five step framework</strong>:</p>
<ol>
<li><strong>Identify the change:</strong> is it a non-price factor (shift) or the firm's own price (movement)? Is it on the demand side or the supply side, or both?</li>
<li><strong>Show the shift:</strong> direction of each curve, the excess demand or supply created, and the new equilibrium.</li>
<li><strong>Quantify with elasticity:</strong> YED tells you how far demand shifts when incomes change; PED tells you how quantity reacts to a price change and what happens to total revenue.</li>
<li><strong>Link to the business objective:</strong> revenue, costs, profit, cash flow, market share, capacity, staffing.</li>
<li><strong>Evaluate:</strong> combined effects, magnitude, time period, reliability of estimates, and a judgement.</li>
</ol>
<p><strong>Combining PED and YED numerically.</strong> If incomes fall 5% (YED 1.6) and a firm raises its price 4% (PED -0.5):</p>
<ul>
<li>Income effect: 1.6 x -5 = -8%</li>
<li>Price effect: -0.5 x 4 = -2%</li>
<li>Combined estimate: -8 + (-2) = <strong>-10%</strong> (applying them in turn gives 0.92 x 0.98 = 0.9016, a fall of 9.84%)</li>
</ul>
<p>The quick additive method is fine for small changes; the multiplicative method is more precise. State which you have used. Then go further: with demand falling 10% but price rising 4%, total revenue falls by roughly 6% (1.04 x 0.90 = 0.936). This kind of processing is what separates top level answers.</p>`
    }
  ],

  keyPoints: [
    "Command word plus mark total tells you the skills needed and the length: define and calculate are short; analyse needs developed chains; assess and evaluate need a judgement.",
    "Four skills: Knowledge (theory), Application (the case), Analysis (linked chains), Evaluation (weighing and judging).",
    "Build chains: event, because, this means, which leads to, therefore; always name the curve and the direction.",
    "Diagrams earn marks only when fully labelled and referred to in the text, with the process to the new equilibrium explained.",
    "Process the data: calculate percentages, elasticities and total revenue rather than copying numbers.",
    "Evaluate with: it depends on, short run vs long run, magnitude, likelihood, ceteris paribus, other factors.",
    "Combine YED (how far income shifts demand) with PED (reaction to price) to quantify mixed scenarios.",
    "Finish assess and evaluate answers with a justified judgement that answers the question and states the key condition."
  ],

  mistakes: [
    "Writing generic theory with no reference to the business. Use names, products, prices and data from the case in every paragraph.",
    "Listing many undeveloped points in an 'analyse' question. Two linked chains of reasoning score higher than five assertions.",
    "Saying 'demand increases' when price rises. A price change causes a contraction or extension along the curve, not a shift.",
    "Drawing an unlabelled diagram or never mentioning it. Label axes, curves and equilibria, then explain the diagram in a sentence.",
    "Ending with a conclusion that only summarises. A judgement must answer the question, give the key reason and say what it depends on.",
    "Dropping signs or units in calculations. PED is normally negative, YED's sign shows the type of good, and money answers need QAR."
  ],

  examples: [
    { title: "Explain (4 marks): a supply shift with PED",
      question: "Qatar Fresh Dairy faces a 12% rise in the cost of imported animal feed. Its fresh milk has an estimated PED of -0.3. Explain one likely effect of the rise in feed costs on Qatar Fresh Dairy's total revenue. (4)",
      marks: 4,
      steps: [
        { label: "Knowledge", html: "<p><strong>[Knowledge]</strong> A rise in costs of production shifts the supply curve to the left, raising the equilibrium price. PED measures the responsiveness of quantity demanded to a change in price.</p>" },
        { label: "Application", html: "<p><strong>[Application]</strong> Feed is a major cost for Qatar Fresh Dairy, so the 12% rise will lead it to raise milk prices. Fresh milk has PED of -0.3, so it is price inelastic, as it is a daily necessity with few substitutes.</p>", diagram: { type: "sd", d: 0, s: -1, title: "Higher feed costs shift supply left", labels: true } },
        { label: "Analysis", html: "<p><strong>[Analysis]</strong> Because demand is inelastic, the percentage fall in quantity demanded will be smaller than the percentage rise in price; a 10% price rise would cut sales by only 3%. This means total revenue will rise (roughly 1.10 x 0.97 = 1.067, about +6.7%), helping the dairy cover its higher feed costs.</p>" },
        { label: "Check against the mark scheme", html: "<p>One mark each for knowledge, application, and two for the developed analysis. No evaluation is needed for 'explain', so stop here and save time for the higher tariff questions.</p>" }
      ],
      examinerNote: "Typical scheme: 1 Knowledge, 1 Application, 2 Analysis. A generic answer ('price rises so revenue rises') with no use of -0.3 or milk would score 1 or 2 at most." },

    { title: "Analyse (6 marks): incomes and a portfolio",
      question: "Gulf Getaways, a Doha travel agency, sells luxury Maldives packages (YED 2.8) and budget regional coach tours (YED -0.4). Real incomes in Qatar are forecast to rise by 5%. Analyse the likely impact of this forecast on Gulf Getaways. (6)",
      marks: 6,
      steps: [
        { label: "Knowledge", html: "<p><strong>[Knowledge]</strong> YED measures the responsiveness of quantity demanded to a change in income. A YED above 1 shows a luxury; a negative YED shows an inferior good.</p>" },
        { label: "Chain 1: luxury packages", html: "<p><strong>[Application]</strong> Maldives packages have a YED of 2.8, so a 5% rise in income should raise demand by 2.8 x 5 = 14%. <strong>[Analysis]</strong> This shifts demand for packages to the right, creating excess demand at the current price, especially in peak holiday months. This means Gulf Getaways can reduce discounting and raise package prices, which leads to higher revenue per booking as well as more bookings, therefore increasing profit, since its office and staff costs are largely fixed.</p>" },
        { label: "Chain 2: budget coach tours", html: "<p><strong>[Application]</strong> Coach tours have a YED of -0.4, so demand should fall by 0.4 x 5 = 2%. <strong>[Analysis]</strong> As customers trade up to flights and resort holidays, the tours will run with more empty seats. Because coach hire is a cost per trip, lower load factors raise the cost per passenger, which leads to lower margins; therefore the agency may need to reduce the number of departures.</p>" },
        { label: "Pull the strands together", html: "<p><strong>[Analysis]</strong> Overall the impact is positive because the luxury effect (+14% on a high value product) is far larger than the inferior effect (-2% on a low value product), so the change in revenue mix favours Gulf Getaways. No judgement is required for 'analyse', but a short linking sentence shows control.</p>" }
      ],
      examinerNote: "Level 3 (5 to 6 marks) needs accurate knowledge, application of both YED values, and two developed chains of reasoning. Calculating the 14% and -2% changes is strong application." },

    { title: "Assess (10 marks): combining shifts, PED and YED",
      question: "DohaDrive, a ride hailing app, is considering raising its standard fare per kilometre by 8%. Fuel costs for its drivers have risen by 15%, and a slowdown is expected to reduce real incomes by 3%. Market research suggests PED for standard rides is -0.6 and YED is 1.2. DohaDrive currently earns QAR 4.5 million a month from 300,000 standard rides. Assess whether DohaDrive should raise its fare. (10)",
      marks: 10,
      steps: [
        { label: "Knowledge and the market change", html: "<p><strong>[Knowledge]</strong> Higher fuel costs shift the supply of rides to the left, as fewer drivers are willing to work at the current fare. PED measures responsiveness of demand to price; YED to income. <strong>[Application]</strong> With fuel up 15%, DohaDrive risks losing drivers unless fares rise, which would lengthen waiting times.</p>", diagram: { type: "sd", d: -1, s: -1, title: "Fuel costs cut supply; lower incomes cut demand", labels: true } },
        { label: "Process the data", html: "<p><strong>[Application]</strong> Current average fare = 4,500,000 / 300,000 = QAR 15. Income effect: 1.2 x -3 = -3.6%. Price effect: -0.6 x 8 = -4.8%. Combined (applied in turn): 300,000 x 0.964 x 0.952 = <strong>275,318 rides</strong>. New fare QAR 16.20. New revenue = 275,318 x 16.20 = <strong>about QAR 4.46 million</strong>. Without the fare rise: 289,200 x 15 = QAR 4.34 million.</p>" },
        { label: "Analysis: the case for raising", html: "<p><strong>[Analysis]</strong> Because demand is price inelastic, the 8% fare rise reduces rides by less than 8%, so revenue is about QAR 120,000 higher than if the fare stays the same. This means DohaDrive can pass on part of the fuel cost to riders, which keeps driver earnings attractive, therefore protecting the supply of drivers and service quality.</p>" },
        { label: "Analysis: the case against", html: "<p><strong>[Analysis]</strong> However, standard rides are income elastic (YED 1.2), so the slowdown already shifts demand left. Combined with the fare rise, rides fall by about 8%, which leads to longer idle time for drivers between trips; therefore drivers' hourly earnings may not rise as much as the fare suggests, and some may still leave.</p>" },
        { label: "Evaluation and judgement", html: "<p><strong>[Evaluation]</strong> The decision depends on how reliable the PED estimate is. Ride hailing has close substitutes such as taxis, the metro and rival apps; if a rival keeps its fares unchanged, DohaDrive's demand may be far more elastic than -0.6 in practice, turning the revenue gain into a loss. In the long run riders may switch to the metro. Overall, a fare rise is justified because inelastic demand means revenue rises and driver supply must be protected, but a smaller rise of around 5%, monitored weekly against rivals' fares, would limit the risk if the estimate proves too low.</p>" }
      ],
      examinerNote: "Top level answers process the data (fare, revenue with and without the change), analyse both sides with full chains, and give a judgement with a condition. Recognising that both curves shift, making price uncertain in the wider market, is a sign of strong knowledge." }
  ],

  practice: [
    { id: "exam-p1", level: "Core", type: "classify", title: "Which skill does this sentence show?",
      question: "A student is answering: 'Assess the impact of a 10% price rise on Karak Corner, a Doha tea chain.' Classify each sentence by the main skill it shows.",
      categories: ["Knowledge", "Application", "Analysis", "Evaluation"],
      items: [
        { text: "PED is the percentage change in quantity demanded divided by the percentage change in price.", cat: 0 },
        { text: "Karak Corner's price rises from QAR 5 to QAR 5.50, and there are three rival tea shops on the same street.", cat: 1 },
        { text: "Because rivals sell close substitutes, demand is likely to be elastic, so the fall in cups sold will exceed 10%, which means total revenue falls.", cat: 2 },
        { text: "However, this depends on loyalty; if customers value the chain's taste, demand may be inelastic in the short run.", cat: 3 },
        { text: "A price rise causes a contraction along the demand curve.", cat: 0 },
        { text: "Overall the rise is risky because three rivals are nearby, although it may work if rivals also raise prices.", cat: 3 },
        { text: "Karak Corner sold 2,000 cups a day before the rise and 1,700 after, a 15% fall.", cat: 1 },
        { text: "Lower volume leads to wasted milk and tea, which raises cost per cup and therefore reduces profit margins.", cat: 2 }
      ],
      explain: "<p><strong>Knowledge</strong> sentences are general theory that would be true of any firm. <strong>Application</strong> uses the case facts and data. <strong>Analysis</strong> is a linked chain (because, so, which means, therefore). <strong>Evaluation</strong> weighs, qualifies ('depends on', 'however') or judges ('overall').</p>",
      hints: ["Would the sentence be true of any business? Then it is knowledge.", "Does it use Karak Corner's data without developing consequences? Then it is application.", "Look for connectives: chains are analysis; 'depends on' and 'overall' signal evaluation."] },

    { id: "exam-p2", level: "Core", type: "calc", title: "PED from case data, then revenue",
      context: "A Doha gym raises its monthly membership from QAR 400 to QAR 440. Memberships fall from 1,500 to 1,410.",
      question: "Calculate the change in total monthly revenue (in QAR) after the price rise. Enter a positive number for a rise, negative for a fall.",
      answer: 20400, tolerance: 1, unit: "QAR",
      working: "<p>Old TR = 400 x 1,500 = QAR 600,000. New TR = 440 x 1,410 = QAR 620,400. Change = <strong>+QAR 20,400</strong>. Check with PED: %change Qd = (1,410 minus 1,500) / 1,500 x 100 = -6%; %change P = +10%; PED = -0.6 (inelastic), so a price rise increases revenue, as the numbers confirm.</p>",
      hints: ["Total revenue = price x quantity.", "Calculate old TR and new TR separately.", "New TR minus old TR."] },

    { id: "exam-p3", level: "Stretch", type: "calc", title: "Combining PED and YED",
      context: "An electronics store in Doha sells 5,000 tablets a month. Real incomes are forecast to rise by 4% and the store plans to raise its price by 5%. YED for tablets is 1.5 and PED is -1.2.",
      question: "Using the additive method (add the income effect and the price effect), calculate the predicted overall percentage change in tablets sold.",
      answer: 0, tolerance: 0.05, unit: "%",
      working: "<p>Income effect = 1.5 x 4 = <strong>+6%</strong>. Price effect = -1.2 x 5 = <strong>-6%</strong>. Combined = 6 + (-6) = <strong>0%</strong>. Sales are predicted to stay at about 5,000; the rising incomes have been fully used up by the price rise. Because price is 5% higher and volume unchanged, total revenue rises about 5%. (The multiplicative method gives 1.06 x 0.94 = 0.9964, a fall of 0.36%, which is the same conclusion.)</p>",
      hints: ["Income effect = YED x % change in income.", "Price effect = PED x % change in price (remember PED is negative).", "Add the two effects."] },

    { id: "exam-p4", level: "Stretch", type: "diagram", title: "Two shifts in one case",
      context: "A Doha bakery chain sells luxury cakes (YED 1.8). Real incomes rise strongly, and at the same time the price of imported butter and flour rises sharply. Show the effect on the market for luxury cakes.",
      expect: { d: 1, s: -1 }, price: "rise", quantity: "uncertain",
      explain: "<p>Rising incomes shift <strong>demand right</strong> (a luxury with positive YED). Higher ingredient costs shift <strong>supply left</strong>. Both shifts push price up, so <strong>price rises</strong>. The demand shift raises quantity but the supply shift reduces it, so the effect on <strong>quantity is uncertain</strong>: it depends on which shift is larger. In an exam answer, use the case data (size of income growth and YED versus the size of the cost rise) to argue which effect dominates.</p>",
      hints: ["Identify which factor affects buyers and which affects sellers.", "Both shifts push price in the same direction.", "The two shifts push quantity in opposite directions."] },

    { id: "exam-p5", level: "Expert", type: "extended", title: "Assess: a sugar tax and a juice bar",
      context: "Squeeze & Go runs 12 juice bars in Doha malls, selling 60,000 drinks a month at an average price of QAR 18. The government introduces a tax on sweetened drinks, raising Squeeze & Go's cost per drink by QAR 2. Market research estimates PED for its drinks at -1.4 and YED at 1.3. The chain's main rival, a global coffee brand, sells low sugar iced drinks at QAR 20. Incomes in Qatar are forecast to grow by 2% next year.",
      question: "Assess whether Squeeze & Go should pass the full cost of the tax on to its customers. (10)",
      marks: 10,
      checklist: [
        { point: "Defines PED or explains that a tax shifts supply left", marks: 1, skill: "Knowledge" },
        { point: "Calculates the % price rise if the tax is passed on (2 / 18 = about 11.1%)", marks: 1, skill: "Application" },
        { point: "Uses PED -1.4 to estimate the fall in drinks sold (about 15.6%) and the effect on revenue", marks: 1, skill: "Application" },
        { point: "Uses the YED of 1.3 and 2% income growth to estimate an offsetting rise in demand (about 2.6%)", marks: 1, skill: "Application" },
        { point: "Chain: elastic demand means passing on the full tax reduces quantity by more than the price rise, so total revenue falls", marks: 1, skill: "Analysis" },
        { point: "Chain: absorbing the tax keeps volume but cuts margin per drink, reducing profit", marks: 1, skill: "Analysis" },
        { point: "Uses the rival's QAR 20 price to analyse substitution and the gap that remains", marks: 1, skill: "Analysis" },
        { point: "Considers reliability of PED estimate and that the tax also affects rivals' sugary drinks (ceteris paribus)", marks: 1, skill: "Evaluation" },
        { point: "Considers alternatives (partial pass on, low sugar recipes that avoid the tax) and short vs long run", marks: 1, skill: "Evaluation" },
        { point: "Justified judgement answering 'should it pass on the full cost' with a key condition", marks: 1, skill: "Evaluation" }
      ],
      model: `<p><strong>[Knowledge]</strong> A tax on sweetened drinks raises the cost of each drink, shifting the supply curve to the left. PED measures how responsive quantity demanded is to a change in price.</p>
<p><strong>[Application]</strong> Passing on the full QAR 2 tax raises the price from QAR 18 to QAR 20, an increase of 11.1%. With PED of -1.4, quantity demanded would fall by about 1.4 x 11.1 = 15.6%. Income growth of 2% with YED 1.3 adds about 2.6%, so the net fall is roughly 13%, from 60,000 to about 52,200 drinks. Revenue would change from QAR 1,080,000 to about 52,200 x 20 = QAR 1,044,000.</p>
<p><strong>[Analysis]</strong> Because demand is price elastic, the percentage fall in drinks sold exceeds the percentage rise in price, so total revenue falls by around QAR 36,000. Fewer drinks also means fruit wastage and staff time per drink rise, which leads to higher average costs. In addition, the new price of QAR 20 equals the rival's low sugar iced drinks, removing Squeeze & Go's price advantage, so customers may switch, therefore the true fall could be larger than the estimate.</p>
<p><strong>[Analysis]</strong> On the other hand, if Squeeze & Go absorbs the tax, its price stays at QAR 18 and volume is maintained (and rises slightly with income growth), but the margin per drink falls by QAR 2. Across around 61,600 drinks that is over QAR 120,000 a month of tax paid out of margin. However, passing the tax on does not avoid it: the chain still pays QAR 2 on each of about 52,200 drinks (about QAR 104,000). Revenue after tax is therefore about QAR 985,000 a month if it absorbs the tax (61,600 x 16) compared with about QAR 940,000 if it passes it on (52,200 x 18), although the extra 9,400 drinks add ingredient and staff costs, so the gap in profit is smaller than this.</p>
<p><strong>[Evaluation]</strong> The decision depends on the reliability of the PED estimate and on what rivals do. The tax applies to all sweetened drinks, so if competitors also raise prices, Squeeze & Go's demand will be less elastic than -1.4 suggests, because ceteris paribus no longer holds. In the long run the chain could reformulate recipes to cut sugar, avoiding much of the tax and appealing to health conscious customers.</p>
<p><strong>[Evaluation]</strong> Overall, Squeeze & Go should not pass on the full cost immediately, because demand is price elastic and the QAR 20 price matches its main rival. A partial pass on (for example QAR 1) shares the burden, limits the fall in volume and protects some margin, while low sugar drinks are developed. This judgement depends mainly on whether rivals raise their own prices: if they do, a full pass on becomes far less risky.</p>`,
      hints: ["Start by turning the QAR 2 tax into a percentage price rise and use PED to estimate the volume effect.", "Remember the income growth: YED shifts demand at the same time.", "Compare passing on with absorbing the tax, bring in the rival's QAR 20 price, and finish with a judgement and condition."] },

    { id: "exam-p6", level: "Expert", type: "extended", title: "Evaluate: Doha hotel strategy for a slowdown",
      context: "Corniche Grand is a 300 room luxury hotel in Doha with average occupancy of 80% at QAR 900 a night. A regional slowdown is forecast to reduce visitor incomes by 4% over the next year. The hotel estimates YED for its rooms at 2.0 and PED at -1.8. A new 400 room mid-range hotel is opening nearby at QAR 450 a night. Management is considering two options: Option A, cut room rates by 10%; Option B, keep rates and spend QAR 1.2 million a year on a loyalty programme and corporate contracts.",
      question: "Evaluate which option Corniche Grand should choose. (12)",
      marks: 12,
      checklist: [
        { point: "Accurate knowledge of YED and PED, identifying rooms as a luxury with price elastic demand", marks: 1, skill: "Knowledge" },
        { point: "Recognises the slowdown shifts demand left and the new hotel adds a close substitute, further shifting demand left", marks: 1, skill: "Knowledge" },
        { point: "Calculates the income effect (2.0 x -4 = -8%) on current room nights (240 a night, about 220.8)", marks: 1, skill: "Application" },
        { point: "Calculates the price effect of Option A (-1.8 x -10 = +18%) and resulting revenue compared with doing nothing", marks: 1, skill: "Application" },
        { point: "Uses the QAR 1.2 million cost of Option B relative to revenue (about QAR 216,000 a night at present)", marks: 1, skill: "Application" },
        { point: "Chain for Option A: elastic demand, so a price cut raises total revenue and occupancy, supporting restaurant and spa income", marks: 1, skill: "Analysis" },
        { point: "Chain for Option A risks: capacity limit of 300 rooms, higher variable costs, damage to luxury image, rivals may match", marks: 1, skill: "Analysis" },
        { point: "Chain for Option B: loyalty and corporate contracts make demand less price elastic and less income sensitive, protecting the premium price", marks: 1, skill: "Analysis" },
        { point: "Evaluates reliability of the elasticity estimates and the presence of the new hotel (ceteris paribus)", marks: 1, skill: "Evaluation" },
        { point: "Considers short run versus long run effects of each option", marks: 1, skill: "Evaluation" },
        { point: "Considers magnitude: compares estimated revenue gain of A with cost of B", marks: 1, skill: "Evaluation" },
        { point: "Justified recommendation stating the key condition it depends on", marks: 1, skill: "Evaluation" }
      ],
      model: `<p><strong>[Knowledge]</strong> YED measures the responsiveness of demand to a change in income, and PED measures the responsiveness of demand to a change in price. With YED of 2.0, Corniche Grand's rooms are a luxury; with PED of -1.8, demand is price elastic. The slowdown shifts demand left, and the new mid-range hotel adds a substitute, shifting it further left.</p>
<p><strong>[Application]</strong> At 80% occupancy the hotel sells 240 rooms a night, earning 240 x 900 = QAR 216,000. A 4% fall in income reduces demand by 2.0 x 4 = 8%, to about 220.8 rooms, giving QAR 198,720 a night if nothing is done (about QAR 6.3 million less a year).</p>
<p><strong>[Analysis] Option A.</strong> A 10% rate cut to QAR 810 increases quantity demanded by 1.8 x 10 = 18%, so 220.8 x 1.18 = about 260.5 rooms, giving revenue of about QAR 211,000 a night. Because demand is elastic, the price cut raises revenue compared with doing nothing, by roughly QAR 12,300 a night (about QAR 4.5 million a year). Higher occupancy also leads to more spending in restaurants and the spa, therefore supporting total profit. However, more guests raise variable costs (cleaning, laundry, staff), and discounting a luxury brand may weaken its premium image, which would make it harder to return to QAR 900 when incomes recover.</p>
<p><strong>[Analysis] Option B.</strong> Loyalty schemes and corporate contracts lock in repeat customers whose bookings are paid by employers, so they are less sensitive to both personal income and price. This means demand becomes less elastic and the hotel can keep QAR 900 rates, protecting its brand. The QAR 1.2 million cost is only about 1.5% of annual room revenue (about QAR 79 million), so if it retains even 6 rooms a night (QAR 5,400 a night, about QAR 2 million a year), it pays for itself.</p>
<p><strong>[Evaluation]</strong> The calculations rest on elasticity estimates from past data. With a new hotel nearby at half the price, ceteris paribus does not hold: price sensitive guests may switch regardless of a 10% cut, because QAR 810 is still far above QAR 450. This suggests Option A competes on the wrong dimension, since the two hotels serve different segments. The size of Option A's gain is also uncertain, as rivals in the luxury segment may match the cut, removing the extra demand.</p>
<p><strong>[Evaluation]</strong> In the short run Option A produces a faster, larger revenue boost, which matters if cash flow is weak. In the long run Option B builds a stable base of customers that is protected from future slowdowns and preserves the brand.</p>
<p><strong>[Evaluation] Recommendation:</strong> Corniche Grand should choose Option B, supported by short, targeted offers in quiet periods rather than a permanent 10% cut. The key reason is that the threat is long term (a new competitor plus an income shock) and a luxury brand is a lasting asset. This depends on the corporate contracts being signed quickly; if they are not in place within a few months and occupancy falls sharply, a temporary rate cut would be justified to protect cash flow.</p>`,
      hints: ["Calculate the starting revenue, the effect of the income fall, then the effect of each option.", "Analyse both options with full chains, including risks to the luxury brand and the role of the new hotel.", "Weigh short run versus long run and the reliability of the estimates, then make a recommendation with a condition."] }
  ],

<script>/* Supply and Demand Mastery: app shell */
(function () {
  var TOP = (window.TOPICS || []).slice().sort(function (a, b) { return a.order - b.order; });
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === "class") e.className = attrs[k]; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  function toast(msg) { var t = el("div", { class: "toast" }, esc(msg)); document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function num(s) { s = String(s).replace(/[,\s%]|QAR/gi, "").replace(/[−–]/g, "-"); if (s === "" || isNaN(+s)) return null; return +s; }

  /* ---------- storage ---------- */
  var KEY = "sdAL_progress_v1", S;
  try { S = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { S = {}; }
  ["learn", "ex", "prac", "quiz", "text"].forEach(function (k) { S[k] = S[k] || {}; });
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function topicPct(t) {
    var learn = S.learn[t.id] ? 1 : 0, ex = 0, pr = 0;
    (t.examples || []).forEach(function (x, i) { if (S.ex[t.id + ":" + i]) ex++; });
    ex = t.examples.length ? ex / t.examples.length : 0;
    (t.practice || []).forEach(function (p) { if (S.prac[p.id]) pr++; });
    pr = t.practice.length ? pr / t.practice.length : 0;
    var qz = S.quiz[t.id] ? S.quiz[t.id].best / S.quiz[t.id].total : 0;
    return Math.round((learn * 0.15 + ex * 0.15 + pr * 0.4 + qz * 0.3) * 100);
  }

  /* ---------- diagram engine ---------- */
  var SH = 18;
  var X = function (q) { return 52 + q * 2.8; }, Y = function (p) { return 262 - p * 2.3; };
  function line(x1, y1, x2, y2, st) { return '<line x1="' + X(x1) + '" y1="' + Y(y1) + '" x2="' + X(x2) + '" y2="' + Y(y2) + '" ' + st + "/>"; }
  function txt(q, p, s, st, anchor) { return '<text x="' + X(q) + '" y="' + Y(p) + '" ' + (anchor ? 'text-anchor="' + anchor + '" ' : "") + (st || "") + ">" + s + "</text>"; }
  function clipLine(f, q0, q1) { // f: q -> p, returns [qa, qb] within box
    var a = Math.max(q0, 0), b = Math.min(q1, 100), pts = [];
    for (var q = a; q <= b + 1e-9; q += 0.5) { var p = f(q); if (p >= 4 && p <= 96) pts.push(q); }
    return pts.length ? [pts[0], pts[pts.length - 1]] : null;
  }
  function curve(f, q0, q1, color, dash, label, labAt) {
    var c = clipLine(f, q0, q1); if (!c) return "";
    var s = line(c[0], f(c[0]), c[1], f(c[1]), 'stroke="' + color + '" stroke-width="3.2" stroke-linecap="round"' + (dash ? ' stroke-dasharray="9 6"' : ""));
    var lq = labAt === "start" ? c[0] : c[1];
    s += txt(lq + (labAt === "start" ? -1 : 1.5), f(lq) + (labAt === "start" ? 3 : -2), label, 'font-weight="800" font-size="15" fill="' + color + '"', labAt === "start" ? "end" : "start");
    return s;
  }
  function guide(q, p, pl, ql, color) {
    return line(0, p, q, p, 'stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 4"') + line(q, 0, q, p, 'stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 4"') +
      '<circle cx="' + X(q) + '" cy="' + Y(p) + '" r="5.5" fill="' + (color || "var(--ink)") + '"/>' +
      (pl ? txt(-2, p - 1.7, pl, 'font-weight="800" font-size="13" fill="' + (color || "var(--ink)") + '"', "end") : "") +
      (ql ? txt(q, -7.5, ql, 'font-weight="800" font-size="13" fill="' + (color || "var(--ink)") + '"', "middle") : "");
  }
  function arrowDefs() { return '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>'; }
  function arrow(q1, p1, q2, p2) { return line(q1, p1, q2, p2, 'stroke="var(--accent)" stroke-width="2.6" marker-end="url(#ah)"'); }
  function axes(xl, yl) {
    return '<rect x="0" y="0" width="360" height="300" fill="var(--paper)" rx="12"/>' + arrowDefs() +
      '<line x1="52" y1="262" x2="340" y2="262" stroke="var(--ink)" stroke-width="2"/><line x1="52" y1="262" x2="52" y2="18" stroke="var(--ink)" stroke-width="2"/>' +
      '<text x="340" y="292" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink2)">' + (xl || "Quantity") + '</text>' +
      '<text x="14" y="140" font-size="13" font-weight="700" fill="var(--ink2)" transform="rotate(-90 14 140)" text-anchor="middle">' + (yl || "Price (QAR)") + "</text>";
  }
  var DCOL = "var(--blue)", SCOL = "var(--teal)", NEWC = "var(--accent)";
  function sdSVG(o) {
    o = o || {};
    var show = o.show || "both", a = (o.d || 0) * SH, b = (o.s || 0) * SH;
    var Dp = function (sh) { return function (q) { return 100 - (q - sh); }; }, Sp = function (sh) { return function (q) { return q - sh; }; };
    var g = axes();
    var hasD = show !== "supply", hasS = show !== "demand";
    if (hasD) g += curve(Dp(0), 0, 100, DCOL, false, a ? "D1" : "D", "end");
    if (hasS) g += curve(Sp(0), 0, 100, SCOL, false, b ? "S1" : "S", "end");
    if (hasD && a) { g += curve(Dp(a), 0, 100, NEWC, true, "D2", "end"); g += arrow(25 + (a > 0 ? 2 : -2), 75, 25 + a + (a > 0 ? -3 : 3), 75); }
    if (hasS && b) { g += curve(Sp(b), 0, 100, NEWC, true, "S2", "end"); g += arrow(70 + (b > 0 ? 2 : -2), 70, 70 + b + (b > 0 ? -3 : 3), 70); }
    if (o.move) {
      var up = o.move === "up";
      if (hasD) { var pB = up ? 65 : 35; g += guide(50, 50, "P1", "Q1"); g += guide(100 - pB, pB, "P2", "Q2", NEWC); g += arrow(50 + (up ? -2 : 2), 50 + (up ? 2 : -2), 100 - pB + (up ? 2 : -2), pB + (up ? -2 : 2)); }
      else { var pC = up ? 65 : 35; g += guide(50, 50, "P1", "Q1"); g += guide(pC, pC, "P2", "Q2", NEWC); g += arrow(50 + (up ? 2 : -2), 50 + (up ? 2 : -2), pC + (up ? -2 : 2), pC + (up ? -2 : 2)); }
    } else if (o.price && hasD && hasS) {
      var P = o.price === "high" ? 72 : 28, qd = 100 - P, qs = P;
      g += guide(50, 50, "Pe", "Qe");
      g += line(0, P, 100, P, 'stroke="var(--accent)" stroke-width="2"') + txt(-2, P - 1.7, "P", 'font-weight="800" font-size="13" fill="var(--accent)"', "end");
      g += line(qd, 0, qd, P, 'stroke="var(--blue)" stroke-width="1.4" stroke-dasharray="4 4"') + txt(qd, -7.5, "Qd", 'font-weight="800" font-size="12" fill="var(--blue)"', "middle");
      g += line(qs, 0, qs, P, 'stroke="var(--teal)" stroke-width="1.4" stroke-dasharray="4 4"') + txt(qs, -7.5, "Qs", 'font-weight="800" font-size="12" fill="var(--teal)"', "middle");
      var lo = Math.min(qd, qs), hi = Math.max(qd, qs);
      g += '<line x1="' + X(lo) + '" y1="' + (Y(P) - 10) + '" x2="' + X(hi) + '" y2="' + (Y(P) - 10) + '" stroke="var(--accent)" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>';
      g += txt((lo + hi) / 2, P + 7, o.price === "high" ? "Excess supply" : "Excess demand", 'font-weight="800" font-size="13" fill="var(--accent)"', "middle");
    } else if (hasD && hasS) {
      var q1 = 50, p1 = 50; g += guide(q1, p1, a || b ? "P1" : "Pe", a || b ? "Q1" : "Qe");
      if (a || b) {
        var q2 = (100 + a + b) / 2, p2 = q2 - b;
        if (Math.abs(q2 - q1) < 1 && Math.abs(p2 - p1) < 1) { /* no change */ }
        else if (Math.abs(q2 - q1) < 1) { g = g.replace(">Q1<", ">Q1 = Q2<"); g += guide(q2, p2, "P2", "", NEWC); }
        else if (Math.abs(p2 - p1) < 1) { g = g.replace(">P1<", ">P1 = P2<"); g += guide(q2, p2, "", "Q2", NEWC); }
        else g += guide(q2, p2, "P2", "Q2", NEWC);
      }
    } else if (hasD && a) { g += guide(50, 50, "P1", "Q1"); g += guide(50 + a, 50, "", "Q2", NEWC); }
    else if (hasS && b) { g += guide(50, 50, "P1", "Q1"); g += guide(50 + b, 50, "", "Q2", NEWC); }
    return '<svg viewBox="0 0 360 300" role="img" aria-label="' + esc(o.title || "Supply and demand diagram") + '" style="font-family:var(--sans)">' + g + "</svg>";
  }
  function pedSVG(o) {
    var el_ = o.kind === "elastic", P1 = 40, P2 = 55, Q1 = 60, Q2 = el_ ? 25 : 51;
    var slope = (P2 - P1) / (Q2 - Q1); // negative
    var f = function (q) { return P1 + slope * (q - Q1); };
    var g = axes();
    g += '<rect x="' + X(0) + '" y="' + Y(P1) + '" width="' + (X(Q1) - X(0)) + '" height="' + (Y(0) - Y(P1)) + '" fill="var(--blue)" opacity=".16"/>';
    g += '<rect x="' + X(0) + '" y="' + Y(P2) + '" width="' + (X(Q2) - X(0)) + '" height="' + (Y(0) - Y(P2)) + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="6 4"/>';
    g += curve(f, 0, 100, DCOL, false, "D", "end");
    g += guide(Q1, P1, "P1", el_ ? "Q1" : ""); g += guide(Q2, P2, "P2", el_ ? "Q2" : "", NEWC);
    if (!el_) g += txt(Q2 - 2, -7.5, "Q2", 'font-weight="800" font-size="13" fill="var(--accent)"', "end") + txt(Q1 + 2, -7.5, "Q1", 'font-weight="800" font-size="13" fill="var(--ink)"', "start");
    var tr1 = P1 * Q1, tr2 = P2 * Q2;
    return '<svg viewBox="0 0 360 300" role="img" aria-label="Price ' + o.kind + ' demand" style="font-family:var(--sans)">' + g + "</svg>" +
      '<div class="cap">' + (el_ ? "Price elastic demand: a price rise causes a proportionately larger fall in quantity, so total revenue falls (dashed box smaller than shaded box)." : "Price inelastic demand: a price rise causes a proportionately smaller fall in quantity, so total revenue rises (dashed box larger than shaded box).") + "</div>";
  }
  function diagram(d) {
    var w = el("div", { class: "sd diag" });
    if (!d) return w;
    if (d.type === "ped") w.innerHTML = pedSVG(d);
    else w.innerHTML = sdSVG(d) + (d.title ? '<div class="cap">' + esc(d.title) + "</div>" : "");
    return w;
  }

  /* ---------- widgets ---------- */
  var W = {};
  function shell(title, sub) { var w = el("div", { class: "widget lab" }); w.appendChild(el("h3", null, "🧪 " + title)); w.appendChild(el("p", { class: "wsub" }, sub)); return w; }
  W.sdlab = function () {
    var w = shell("Supply and demand lab", "Shift the curves, or set a price away from equilibrium, and watch what the market does.");
    var st = { d: 0, s: 0, p: 0 };
    var box = el("div", { class: "sdwrap" }), left = el("div"), right = el("div");
    var svg = el("div", { class: "sd" }), msg = el("div", { class: "wmsg" }), rd = el("div", { class: "readout" });
    function draw() {
      svg.innerHTML = st.p ? sdSVG({ price: st.p > 0 ? "high" : "low" }) : sdSVG({ d: st.d, s: st.s });
      var a = st.d * SH, b = st.s * SH, q2 = (100 + a + b) / 2, p2 = q2 - b;
      var qar = function (p) { return "QAR " + (p / 5).toFixed(2); }, units = function (q) { return Math.round(q * 20) + " units"; };
      if (st.p) {
        var P = st.p > 0 ? 72 : 28;
        rd.innerHTML = "<div><small>Price set</small><b>" + qar(P) + "</b></div><div><small>Quantity demanded</small><b>" + units(100 - P) + "</b></div><div><small>Quantity supplied</small><b>" + units(P) + "</b></div>";
        msg.innerHTML = st.p > 0 ? "<b>Excess supply (a surplus).</b> Firms cannot sell all they produce, stock builds up, so they cut prices. As price falls, quantity demanded extends and quantity supplied contracts until the market clears at equilibrium." : "<b>Excess demand (a shortage).</b> Queues and empty shelves appear, so firms can raise prices. As price rises, quantity demanded contracts and quantity supplied extends until the market clears at equilibrium.";
      } else {
        rd.innerHTML = "<div><small>Equilibrium price</small><b>" + qar(p2) + "</b></div><div><small>Equilibrium quantity</small><b>" + units(q2) + "</b></div><div><small>Change vs start</small><b>" + (p2 > 50 ? "P ↑ " : p2 < 50 ? "P ↓ " : "P = ") + (q2 > 50 ? "Q ↑" : q2 < 50 ? "Q ↓" : "Q =") + "</b></div>";
        var m = [];
        if (st.d) m.push("Demand has " + (st.d > 0 ? "increased (shifted right)" : "decreased (shifted left)") + ".");
        if (st.s) m.push("Supply has " + (st.s > 0 ? "increased (shifted right)" : "decreased (shifted left)") + ".");
        if (st.d && st.s) m.push(st.d === st.s ? "Both shift the same way: quantity clearly " + (st.d > 0 ? "rises" : "falls") + ", but the price effect depends on which shift is larger (here they are equal, so price is unchanged)." : "They shift in opposite directions: price clearly " + (st.d > 0 ? "rises" : "falls") + ", but the quantity effect depends on the relative size of the shifts.");
        msg.innerHTML = m.length ? m.join(" ") : "The market is at equilibrium: quantity demanded equals quantity supplied, so there is no pressure for price to change.";
      }
      Array.prototype.forEach.call(ctl.querySelectorAll("button[data-k]"), function (bt) { bt.classList.toggle("on", st[bt.dataset.k] === +bt.dataset.v); });
    }
    var ctl = el("div");
    ctl.innerHTML = '<div class="shiftctl"><b>Demand</b><button class="btn sm" data-k="d" data-v="-1">← decrease</button><button class="btn sm" data-k="d" data-v="1">increase →</button>' +
      '<b>Supply</b><button class="btn sm" data-k="s" data-v="-1">← decrease</button><button class="btn sm" data-k="s" data-v="1">increase →</button>' +
      '<b>Price</b><button class="btn sm" data-k="p" data-v="1">set too high</button><button class="btn sm" data-k="p" data-v="-1">set too low</button></div>';
    ctl.addEventListener("click", function (e) {
      var bt = e.target.closest("button[data-k]"); if (!bt) return;

      if (k === "p") { st.d = 0; st.s = 0; } else st.p = 0;
      draw();
    });
    var reset = el("button", { class: "btn sm", onclick: function () { st = { d: 0, s: 0, p: 0 }; draw(); } }, "↺ Reset");
    left.appendChild(svg); right.appendChild(ctl); right.appendChild(reset); right.appendChild(rd); right.appendChild(msg);
    box.appendChild(left); box.appendChild(right); w.appendChild(box);
    draw();
    return w;
  };
  W.pedlab = function () {
    var w = shell("PED and revenue calculator", "Enter the original and new price and quantity. The lab works out the percentage changes, PED and the effect on total revenue.");
    var row = el("div", { class: "row" });
    var f = { p1: 20, p2: 22, q1: 1000, q2: 850 };
    Object.keys(f).forEach(function (k) {
      var lb = el("label", null, { p1: "Old price (QAR)", p2: "New price (QAR)", q1: "Old quantity", q2: "New quantity" }[k]);
      var inp = el("input", { type: "number", value: f[k], step: "any", inputmode: "decimal" });
      inp.addEventListener("input", function () { f[k] = +inp.value; draw(); });
      lb.appendChild(inp); row.appendChild(lb);
    });
    var rd = el("div", { class: "readout" }), msg = el("div", { class: "wmsg" }), bars = el("div", { class: "sd" });
    function draw() {
      if (!f.p1 || !f.q1) { msg.textContent = "Old price and quantity must not be zero."; return; }
      var pp = (f.p2 - f.p1) / f.p1 * 100, pq = (f.q2 - f.q1) / f.q1 * 100, ped = pp ? pq / pp : NaN;
      var tr1 = f.p1 * f.q1, tr2 = f.p2 * f.q2, m = Math.abs(ped);

      var wc = el("span", { class: "muted", style: "font-size:13px" }, (ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0) + " words");
      sec.appendChild(ta); sec.appendChild(wc);
      var area = el("div");
      sec.appendChild(el("div", { class: "runbar" }, "")).appendChild(el("button", { class: "btn ok", onclick: function (e) {
        e.target.remove();
        area.appendChild(el("p", null, "<b>Self-mark:</b> tick each point your answer clearly includes. Be strict, as an examiner would."));
        var ch = el("div", { class: "check" }), score = el("div", { class: "banner no", style: "margin:8px 0" });
        var upd = function () { var s = 0; ch.querySelectorAll("input").forEach(function (c, i) { if (c.checked) s += p.checklist[i].marks; }); score.innerHTML = "Your score: " + s + " / " + p.marks; score.className = "banner " + (s / p.marks >= 0.7 ? "ok" : "no"); var best = S.prac[p.id + ":score"] || 0; if (s > best) S.prac[p.id + ":score"] = s; save(); };
        p.checklist.forEach(function (c) { var lb = el("label", null, '<input type="checkbox"><span>' + c.point + " <b>(" + c.marks + ")</b></span>" + (c.skill ? '<span class="sk sk-' + c.skill + '">' + c.skill + "</span>" : "")); lb.querySelector("input").addEventListener("change", upd); ch.appendChild(lb); });
        area.appendChild(ch); area.appendChild(score); upd();
        area.appendChild(el("div", { class: "model" }, "<h3 style=\"font-size:16px\">Model answer</h3>" + p.model));
        done();
      } }, "✓ I have finished: self-mark it"));
      sec.appendChild(area);
    }
    sec.appendChild(fb);
    sec.appendChild(hintsBox(p));
    pane.appendChild(sec);
  }

  function quizTab(t, pane) {
    var qs = t.quiz, i = 0, score = 0, log = [];
    var w = el("div", { class: "qwrap" }); pane.appendChild(w);
    function render() {
      w.innerHTML = "";
      if (i >= qs.length) return finish();
      var q = qs[i], best = S.quiz[t.id];
      w.appendChild(el("div", { class: "qhead" }, "<span>Question " + (i + 1) + " of " + qs.length + "</span><span>Score " + score + (best ? " · best " + best.best + "/" + best.total : "") + "</span>"));
      w.appendChild(el("div", { class: "qprog" }, '<i style="width:' + (i / qs.length * 100) + '%"></i>'));
      var sec = el("section", { class: "sec" });
      sec.appendChild(el("div", { class: "qtype" }, { mcq: "Multiple choice", numeric: "Calculate", tf: "True or false", order: "Order the chain of reasoning" }[q.type]));
      sec.appendChild(el("h2", { style: "font-size:19px;margin-top:6px" }, q.q));
      if (q.diagram) sec.appendChild(diagram(q.diagram));
      var fb = el("div"), getAns;
      var submit = el("button", { class: "btn acc" }, "Check answer");
      var next = el("button", { class: "btn pri", style: "display:none", onclick: function () { i++; render(); } }, i < qs.length - 1 ? "Next question →" : "See my score →");
      if (q.type === "mcq" || q.type === "tf") {
        var opts = q.type === "tf" ? ["True", "False"] : q.options, sel = -1;
        var box = el("div", { class: q.type === "tf" ? "tfrow" : "opts" });
        opts.forEach(function (o, j) { box.appendChild(el("button", { class: "opt", onclick: function () { sel = j; Array.prototype.forEach.call(box.children, function (c, k) { c.classList.toggle("sel", k === j); }); } }, (q.type === "tf" ? "" : '<span class="l">' + "ABCDEF"[j] + "</span>") + "<span>" + o + "</span>")); });
        sec.appendChild(box);
        var correct = q.type === "tf" ? (q.answer ? 0 : 1) : q.answer;
        getAns = function () { if (sel < 0) { toast("Choose an answer first"); return null; } Array.prototype.forEach.call(box.children, function (c, k) { c.disabled = true; if (k === correct) c.classList.add("right"); else if (k === sel) c.classList.add("wrong"); }); return { ok: sel === correct }; };
      } else if (q.type === "numeric") {
        var row = el("div", { class: "numin" }), inp = el("input", { type: "text", inputmode: "decimal", placeholder: "your answer", "aria-label": "Your answer" });
        row.appendChild(inp); if (q.unit) row.appendChild(el("b", null, esc(q.unit))); sec.appendChild(row);
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit.click(); });
        getAns = function () { var v = num(inp.value); if (v === null) { toast("Type a number"); return null; } var ok = Math.abs(v - q.answer) <= q.tolerance + 1e-9; inp.className = ok ? "right" : "wrong"; inp.readOnly = true; return { ok: ok, show: ok ? null : "Answer: " + q.answer + (q.unit ? " " + q.unit : "") }; };
      } else if (q.type === "order") {
        var order = shuffle(q.lines.map(function (_, j) { return j; })), tries = 0;
        while (order.every(function (v, j) { return v === j; }) && tries++ < 10) order = shuffle(order);
        var list = el("div", { class: "olist" });
        var drawO = function () {
          list.innerHTML = "";
          order.forEach(function (li, pos) {
            var r = el("div", { class: "oline" });
            r.appendChild(el("span", { class: "no" }, pos + 1));
            r.appendChild(el("span", { class: "tx" }, q.lines[li]));
            r.appendChild(el("button", { "aria-label": "Move up", onclick: function () { if (pos > 0) { var x = order[pos - 1]; order[pos - 1] = order[pos]; order[pos] = x; drawO(); } } }, "▲"));
            r.appendChild(el("button", { "aria-label": "Move down", onclick: function () { if (pos < order.length - 1) { var x = order[pos + 1]; order[pos + 1] = order[pos]; order[pos] = x; drawO(); } } }, "▼"));
            list.appendChild(r);
          });
        };
        drawO(); sec.appendChild(list);
        getAns = function () { var ok = order.every(function (li, pos) { return li === pos; }); Array.prototype.forEach.call(list.children, function (r, pos) { r.classList.add(order[pos] === pos ? "right" : "wrong"); r.querySelectorAll("button").forEach(function (b) { b.disabled = true; }); }); return { ok: ok, show: ok ? null : "Correct order:\n" + q.lines.map(function (l, j) { return (j + 1) + ". " + l.replace(/<[^>]+>/g, ""); }).join("\n") }; };
      }
      submit.onclick = function () {
        var r = getAns(); if (!r) return;
        if (r.ok) score++; log.push({ q: q, ok: r.ok });
        fb.className = "feedback " + (r.ok ? "ok" : "no");
        fb.innerHTML = "<b>" + (r.ok ? "✓ Correct" : "✗ Not quite") + "</b>" + (q.explain || "") + (r.show ? "<pre>" + esc(r.show) + "</pre>" : "");
        submit.style.display = "none"; next.style.display = ""; next.focus();
      };
      var row2 = el("div", { class: "runbar" }); row2.appendChild(submit); row2.appendChild(next);
      sec.appendChild(row2); sec.appendChild(fb); w.appendChild(sec);
    }
    function finish() {
      var prev = S.quiz[t.id]; if (!prev || score > prev.best) S.quiz[t.id] = { best: score, total: qs.length }; save();
      var pct = Math.round(score / qs.length * 100);
      var sec = el("section", { class: "sec score" }, '<div class="qtype">Quiz complete</div><div class="big">' + score + "/" + qs.length + "</div><p>" + (pct === 100 ? "Perfect. You have mastered this topic." : pct >= 80 ? "Excellent. Review the ones you missed." : pct >= 60 ? "Good progress. Revisit the worked examples, then try again." : "Go back to Explain and the worked examples, then retry.") + "</p>");
      var b = el("div", { class: "runbar", style: "justify-content:center" });
      b.appendChild(el("button", { class: "btn acc", onclick: function () { i = 0; score = 0; log = []; render(); } }, "↺ Try again"));
      sec.appendChild(b);
      var rv = el("div", { class: "qreview" });
      log.forEach(function (l, j) { rv.appendChild(el("div", { style: "background:var(--" + (l.ok ? "ok" : "bad") + "-soft)" }, (l.ok ? "✓ " : "✗ ") + "Q" + (j + 1) + ": " + l.q.q.replace(/<[^>]+>/g, "").slice(0, 110))); });
      sec.appendChild(rv); w.appendChild(sec);
    }
    render();
  }

  var th = $("#themeBtn");
  function applyTheme(m) { if (m) document.documentElement.setAttribute("data-theme", m); else document.documentElement.removeAttribute("data-theme"); }
  applyTheme(S.theme);
  th.onclick = function () { var dark = S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; S.theme = dark ? "light" : "dark"; save(); applyTheme(S.theme); };
  route();
})();
</script>
